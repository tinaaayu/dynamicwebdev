<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>petting zoo</title>

  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: "Pixelify Sans", sans-serif;
      background: url("background.gif") center center fixed;
      background-size: cover;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    h1 { 
      text-align: center; 
      font-size: 42px;
      color: black;
      margin-bottom: 20px;
    }

    a { 
      display: block; 
      text-align: center; 
      font-size: 20px;
      color: #000;
      text-decoration: none;
      background: #bada55;
      padding: 10px 20px;
      width: fit-content;
      margin: 0 auto 20px;
      border: 2px solid #000;
      border-radius: 0;
      box-shadow: 4px 4px 0 #000;
      transition: all 0.1s;
    }

    a:hover {
      background: #a0c940;
      box-shadow: 2px 2px 0 #000;
    }

    #zoo { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 20px; 
      justify-content: center; 
    }

    .rockCard { 
      background: #fff; 
      padding: 12px; 
      border-radius: 0;
      width: 160px; 
      text-align: center; 
      border: 2px solid #000;
      box-shadow: 6px 6px 0 #000;
      position: relative;
      transition: transform 0.1s;
    }

    .rockCard img { 
      width: 100px; 
      height: auto; 
      image-rendering: pixelated;
      margin-bottom: 8px;
    }

    .rockCard h3 { 
      margin: 0 0 6px 0; 
      font-size: 18px;
      color: #000;
    }

    .rockCard p { 
      margin: 2px 0; 
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      background: #000;
      color: #fff;
      padding: 2px 6px;
      font-size: 12px;
      margin: 2px 1px;
      border: 2px solid #000;
      border-radius: 0;
    }

    .rockCard button { 
      margin-top: 8px; 
      padding: 6px 10px; 
      background: #bada55; 
      border: 2px solid #000;
      border-radius: 0; 
      cursor: pointer; 
      font-family: "Pixelify Sans";
      font-size: 16px;
      box-shadow: 4px 4px 0 #000;
      transition: all 0.1s;
    }

    .rockCard button:hover { 
      background: #a0c940; 
      box-shadow: 2px 2px 0 #000;
    }
  </style>
</head>
<body>
  <h1>petting zoo</h1>

  <a href="/adopt.html">adopt a new rock</a>

  <div id="zoo"></div>

  <script>
    async function loadRocks() {
      const res = await fetch("/api/rocks");
      const rocks = await res.json();

      const zoo = document.getElementById("zoo");
      zoo.innerHTML = "";

      rocks.forEach(rock => {
        zoo.innerHTML += `
          <div class="rockCard">
            <img src="${rock.image}" alt="${rock.name}" />
            <h3>${rock.name}</h3>
            <p>adopted by: ${rock.adoptedBy}</p>
            <p>
              <span class="badge">${rock.type}</span> 
              <span class="badge">${rock.trait}</span>
            </p>
            <p>pets: <span id="pets-${rock.id}">${rock.petCount}</span></p>
            <button onclick="petRock(${rock.id}, event)">Pet</button>
          </div>
        `;
      });
    }

    function showHeart(event) {
      const heart = document.createElement('div');
      heart.style.position = 'absolute';
      heart.style.width = '16px';
      heart.style.height = '16px';
      heart.style.background = 'url("heart.png") no-repeat center/cover';
      heart.style.left = event.clientX + 'px';
      heart.style.top = event.clientY + 'px';
      heart.style.pointerEvents = 'none';
      heart.style.animation = 'popHeart 0.6s forwards';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 600);
    }

    async function petRock(id, event) {
      showHeart(event);
      const res = await fetch(`/api/pet/${id}`, { method: "POST" });
      const data = await res.json();
      if (data.success) {
        document.getElementById(`pets-${id}`).textContent = data.petCount;
      }
    }

    window.onload = loadRocks;
  </script>

  <style>
    @keyframes popHeart {
      0% { transform: scale(0); opacity: 1; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: translateY(-20px) scale(1); opacity: 0; }
    }
  </style>
</body>
</html>
