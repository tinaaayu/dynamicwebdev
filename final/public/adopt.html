<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>rock adoption form</title>

  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: "Pixelify Sans", sans-serif; 
      background: url("background.gif") center center fixed;
      background-size: cover;
      background-repeat: no-repeat; 
      margin: 0;
      padding: 20px;
      color: #222;
    }


    h1 { 
      text-align: center; 
      font-size: 40px;
      color: black;
    }

    form { 
      max-width: 420px; 
      margin: 50px auto; 
      background: rgba(255,255,255,0.85); 
      padding: 25px; 
      border-radius: 12px; 
      box-shadow: 0 0 10px rgba(0,0,0,0.25); 
      backdrop-filter: blur(3px);
    }

    label { 
      display: block; 
      margin-top: 12px; 
      font-size: 16px;
    }

    input[type="text"] { 
      width: 95%; 
      padding: 10px; 
      margin-top: 5px; 
      border-radius: 6px; 
      border: 2px solid #ccc; 
      font-family: "Pixelify Sans", sans-serif;
      font-size: 15px;
    }

    input[type="checkbox"] {
      transform: scale(1.3);
      margin-right: 8px;
    }

    button { 
      margin-top: 18px; 
      padding: 12px; 
      background: #bada55; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      width: 100%; 
      font-size: 18px;
      font-family: "Pixelify Sans", sans-serif;
    }

    button:hover { 
      background: #a0c940; 
    }
  </style>
</head>
<body>

  <h1>rock adoption form</h1>

  <form id="adoptForm">
    <label for="userName">your name</label>
    <input type="text" id="userName" required />

    <label style="margin-top: 15px;">
      <input type="checkbox" id="responsibility" />
      i am ready for the responsibility of adopting a pet rock!
    </label>

    <label for="rockName">your rock's name (optional)</label>
    <input type="text" id="rockName" placeholder="give your rock a name!" />

    <button type="submit">adopt rock</button>
  </form>

 <script>
  const rockData = {
    "rock1.png": { type: "granite", trait: "grumpy" },
    "rock2.png": { type: "basalt", trait: "bubbly" },
    "rock3.png": { type: "sapphire", trait: "sassy" },
    "rock4.png": { type: "topaz", trait: "tough" },
    "rock5.png": { type: "emerald", trait: "edgy" },
    "rock6.png": { type: "lapis lazuli", trait: "lazy" },
    "rock7.png": { type: "marble", trait: "mature" }
  };

  const form = document.getElementById("adoptForm");
  form.addEventListener("submit", function(event) {
    event.preventDefault();

    const userName = document.getElementById("userName").value.trim();
    const responsibility = document.getElementById("responsibility").checked;
    const rockNameInput = document.getElementById("rockName").value.trim();

    if (!responsibility) {
      alert("you must be ready for the responsibility to adopt a rock!");
      return;
    }

    if (!userName) {
      alert("please enter your name.");
      return;
    }

    // Random image → matched type + trait
    const images = Object.keys(rockData);
    const image = images[Math.floor(Math.random() * images.length)];
    const { type, trait } = rockData[image];

    const name = rockNameInput || `Rocky-${Date.now()}`;

    fetch("/api/adopt", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ adoptedBy: userName, type, trait, image, name })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        window.location.href = "/index.html";
      } else {
        alert("something went wrong. try again.");
      }
    })
    .catch(err => {
      console.error(err);
      alert("error adopting rock.");
    });
  });
</script>

</body>
</html>
